name: Build Hamster Roll Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-android:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.5

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Android export
        shell: bash
        run: |
          set -eu
          echo "Java:"
          command -v java
          command -v javac
          java -version

          echo "Android SDK:"
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT/platforms" ]; then
            echo "ERROR: Android SDK tidak ditemukan di lokasi standar."
            find / -type f -name android.jar 2>/dev/null | head -n 10 || true
            exit 1
          fi

          JAVAC="$(command -v javac)"
          JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$JAVAC")")")"

          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/android_sdk_path = "$SDK_ROOT"
          EOF

          keytool -genkeypair \
            -keystore /tmp/hamster-debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Prepare Godot project
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d "/root/.local/share/godot/export_templates/4.5.stable" ]; then
            mv /root/.local/share/godot/export_templates/4.5.stable ~/.local/share/godot/export_templates/ || true
          fi
          mkdir -p build
          godot --headless --path . --editor --import --quit

      - name: Export Android APK
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: /tmp/hamster-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          godot --headless --path . --export-debug "Android" build/HamsterRollNative.apk
          test -s build/HamsterRollNative.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HamsterRollNative-debug-apk
          path: build/HamsterRollNative.apk
          if-no-files-found: error
          retention-days: 14
